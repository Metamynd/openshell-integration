version: 2

# Weekly update PRs, held back 14 days after a release so a compromised one has time to be noticed and pulled first.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    # The MetaMynd SDKs are bumped by metamynd-sdk-bump.yml, which also records the release in versions.lock.
    ignore:
      - dependency-name: '@metamynd/*'
