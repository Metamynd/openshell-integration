name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Lets metamynd-sdk-bump start ci on its branch: a PR opened with GITHUB_TOKEN does not trigger pull_request.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  pins:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Vendored protos match the pinned OpenShell commit
        run: bash tools/sync-protos.sh --check
      - name: Shell scripts parse
        run: for f in tools/*.sh; do bash -n "$f"; done
