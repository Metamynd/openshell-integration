name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Lets metamynd-sdk-bump start ci on its branch: a PR opened with GITHUB_TOKEN does not trigger pull_request.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  pins:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Vendored protos match the pinned OpenShell commit
        run: bash tools/sync-protos.sh --check
      - name: Shell scripts parse
        run: for f in tools/*.sh; do bash -n "$f"; done
