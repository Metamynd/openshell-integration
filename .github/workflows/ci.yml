name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Lets metamynd-sdk-bump start ci on its branch: a PR opened with GITHUB_TOKEN does not trigger pull_request.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  pins:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vendored protos match the pinned OpenShell commit
        run: bash tools/sync-protos.sh --check
      - name: Shell scripts parse
        run: for f in tools/*.sh; do bash -n "$f"; done
