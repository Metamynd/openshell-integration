# M0 upstream-trust policy (build plan step 0.5, spike S3). The purchasing stand-in runs
# on the host's loopback. host.openshell.internal is the only policy host OpenShell pins
# to loopback, so no allowed_ips entry is needed (and loopback allowed_ips are rejected).
version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort

network_policies:
  purchasing:
    name: purchasing-stand-in
    endpoints:
      - host: host.openshell.internal
        port: 8443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: /purchase-requests }
        credential_binding: { provider: m0-purchasing }
      - host: host.openshell.internal
        port: 8081
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: /purchase-requests }
        credential_binding: { provider: m0-purchasing }
    binaries:
      - { path: /usr/bin/curl }
