# M3 policy: the governed purchasing path. L7 admits only POST /purchase-requests to the
# purchasing gateway; the MetaMynd adapter is the last middleware stage; the provider's bearer
# token is substituted after the chain.
version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort

network_policies:
  purchasing:
    name: purchasing-gateway
    endpoints:
      - host: host.openshell.internal
        port: 8443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: POST, path: /purchase-requests }
        credential_binding: { provider: poc-purchasing }
    binaries:
      - { path: /usr/bin/curl }

network_middlewares:
  metamynd:
    middleware: metamynd
    order: 1000
    on_error: fail_closed
    config: { routes: purchasing-v1 }
    endpoints:
      include: ["host.openshell.internal"]
